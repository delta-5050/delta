    <script>
      // ===== 서버 연결 (GitHub Pages용) =====
      // Apps Script 웹앱 배포 주소 (배포 → 웹 앱 URL, 끝이 /exec)
      // ※ 새 Code.gs를 배포한 주소가 맞는지 꼭 확인하세요.
      const API_URL = "https://script.google.com/macros/s/AKfycbxgMihOhfy1bpf6xaPpCzaunSnoyJGk6Keeh2P-yztCBBMoCI7yyUllfcHK8O_EHVup/exec";

      // 화면 코드가 쓰는 google.script.run.함수이름(...) 호출을 그대로 유지하기 위한 연결부.
      // GitHub Pages에는 진짜 google.script.run이 없으므로, 같은 모양으로 위 주소에 POST 요청을 보낸다.
      // - Content-Type을 text/plain으로 보내는 이유: application/json으로 보내면 브라우저가 사전 확인(OPTIONS)을
      //   먼저 보내는데 Apps Script가 이를 처리하지 못해 CORS 오류가 난다.
      const google = { script: {} };
      Object.defineProperty(google.script, "run", {
        get() {
          let onSuccess = () => {};
          let onFailure = () => {};

          const runner = new Proxy({}, {
            get(target, action) {
              if (action === "withSuccessHandler") return (fn) => { onSuccess = fn; return runner; };
              if (action === "withFailureHandler") return (fn) => { onFailure = fn; return runner; };

              return (...args) => {
                const request = fetch(API_URL, {
                  method: "POST",
                  headers: { "Content-Type": "text/plain;charset=utf-8" },
                  body: JSON.stringify({ action: action, args: args })
                })
                  .then(res => res.json())
                  .then(json => {
                    if (!json.ok) throw new Error(json.error);
                    return json.data;
                  });

                // 성공 처리 중 오류가 나도 실패 핸들러가 다시 불리지 않도록 두 번째 인자로 분리
                request.then(data => onSuccess(data), err => onFailure(err));
              };
            }
          });

          return runner;
        }
      });
    </script>

    <script>
        function handlePhoneInput(currentField, nextFieldId) {
          currentField.value = currentField.value.replace(/[^0-9]/g, '');
          if (currentField.value.length > currentField.maxLength) {
            currentField.value = currentField.value.slice(0, currentField.maxLength);
          }
          if (currentField.value.length === currentField.maxLength && nextFieldId) {
            const nextField = document.getElementById(nextFieldId);
            if (nextField) nextField.focus();
          }
        }

        function getFullPhone(idPrefix) {
          const part1 = document.getElementById(idPrefix + "1").value.trim();
          const part2 = document.getElementById(idPrefix + "2").value.trim();
          const part3 = document.getElementById(idPrefix + "3").value.trim();
          return `${part1}-${part2}-${part3}`;
        }

        let selectedCourses = [];

        document.addEventListener("DOMContentLoaded", function () {

          showAccessPopup();

          document.body.addEventListener("click", function (event) {
            const popup = document.getElementById("access-popup");
            const overlay = document.getElementById("overlay");

            if (isPopupClosed && event.target.id !== "access-popup" && !popup.contains(event.target) && event.target.id !== "overlay") {
              showAccessPopup();
              isPopupClosed = false;
            }
          });

        function showAccessPopup() {
          const overlay = document.getElementById("overlay");
          const popup = document.getElementById("access-popup");
          const timeRemaining = document.getElementById("time-remaining");
          const popupMessage = document.getElementById("popup-message");
          const popupMessage2 = document.getElementById("popup-message2");
          const informForm = document.getElementById("informForm");
          const submitForm = document.getElementById("registrationForm");

          const now = new Date();
          const limitDate = new Date('2026-10-23T14:00:00+09:00'); // 시간 제한

          const remainingTime = limitDate - now;

          function updateCountdown() {
            const now = new Date();
            const remainingTime = limitDate - now;

            // 제한시간 종료
            if (remainingTime <= 0) {
                clearInterval(countdownTimer);

                overlay.style.display = "none";
                popup.style.display = "none";

                informForm.style.display = "block";
                submitForm.style.display = "none";

                return;
            }

            const days = Math.floor(remainingTime / (1000 * 60 * 60 * 24));
            const hours = Math.floor((remainingTime / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((remainingTime / (1000 * 60)) % 60);
            const seconds = Math.floor((remainingTime / 1000) % 60);

            // timeRemaining.innerText = `남은 시간 : ${days}일 ${hours}시간 ${minutes}분 ${seconds}초`;
          }

          if (now < limitDate) {
            popupMessage.innerText = "현재는 온라인 수강신청이 불가합니다. 수강을 희망하실 경우, 학원으로 전화 문의 부탁드립니다.";
            popupMessage2.innerText = "📞 053-782-5050";

            overlay.style.display = "block";
            popup.style.display = "block";

            informForm.style.display = "none";
            submitForm.style.display = "none";

            
            // 기존 타이머 제거
            clearInterval(countdownTimer);
            // 최초 실행
            updateCountdown();
            // 1초마다 갱신
            countdownTimer = setInterval(updateCountdown, 1000);
          } else {
              overlay.style.display = "none";
              popup.style.display = "none";

              informForm.style.display = "block";
              submitForm.style.display = "none";
          }
        }


        function closeAccessPopup() {
          console.log("닫기 버튼 클릭됨"); // 버튼 클릭시 콘솔에 메시지 출력
          const overlay = document.getElementById("overlay");

          popup.style.display = "none";

          isPopupClosed = true;

        //신청내역 조회하는 함수
        function fetchSubmissionData() {
          const name = document.getElementById("lookupName").value.trim();

          if (!name.length || !grade.length || !parentContact.length) {

            return;
          }
          
          showLoading();

          google.script.run.withSuccessHandler(function(results) {

            }
          }).getSubmittedCourses(name, grade, parentContact);

        function loadPreviousApplication(name, grade, parentContact) {
          document.getElementById('informForm').style.display = 'block';
          document.getElementById('information').style.display = 'block';
          document.getElementById("registrationForm").style.display = 'block';
          document.getElementById('checkRegist').style.display = 'none';
          document.getElementById('lookupForm').style.display = 'none';
          document.getElementById('checkRegist').reset();

          showLoading();

          google.script.run
            .withSuccessHandler(function(data) {
              if (!data) {
                hideLoading();
                selectionPopup("📢 알림", "신청내역을 불러오지 못했습니다. 정보를 다시 입력해주세요.");
                return;
              }

              document.getElementById('name').value = data.name;
              document.getElementById('grade').value = data.grade;
              document.getElementById('school').value = data.school;

              const sParts = data.studentContact.split('-');
              const pParts = data.parentContact.split('-');
              document.getElementById('studentContact1').value = sParts[0];
              document.getElementById('studentContact2').value = sParts[1];
              document.getElementById('studentContact3').value = sParts[2];
              document.getElementById('parentContact1').value = pParts[0];
              document.getElementById('parentContact2').value = pParts[1];
              document.getElementById('parentContact3').value = pParts[2];

              // 과목/강의 목록이 다 불러와진 뒤에 변경 모드로 전환하고 장바구니를 채움
              fetchSubjects(() => {
                isResubmission = true;
                selectedCourses = data.courses;
                updateCart();
                selectionPopup("📢 알림", "신청내역이 자동으로 입력되었습니다. 변경 후 다시 신청해주세요\n※변경시 기존 신청내역은 취소됩니다.");
              });
            })
            .withFailureHandler(function() {
              hideLoading();
              selectionPopup("⚠ 경고", "신청내역을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.");
            })
            .getStudentApplication(name, grade, parentContact);
        }

        function goToHome() {
          document.getElementById('informForm').style.display = 'block';
          document.getElementById('information').style.display = 'block';
          document.getElementById("registrationForm").style.display = 'none';
          document.getElementById('checkRegist').style.display = 'none';
          document.getElementById('lookupForm').style.display = 'none';
          document.getElementById("registrationForm").reset();

          selectedCourses = [];
          updateCart();
          lecturesCache = {};
          isResubmission = false;

          const subjectSelect = document.getElementById("subject");
          const lectureSelect = document.getElementById("lecture");
          if (subjectSelect) subjectSelect.innerHTML = "<option value=''>선택</option>";
          if (lectureSelect) lectureSelect.innerHTML = "<option value=''>선택</option>";

          document.getElementById("submit-message").innerText = "";

        function goToChange() {
          loadPreviousApplication(
            document.getElementById("name").value.trim(),
            document.getElementById("grade").value.trim(),
            getFullPhone("parentContact")
          );
        }

        function fetchSubjects(onDone) {
          const grade = document.getElementById('grade').value;

          showLoading();

          google.script.run
            .withSuccessHandler((result) => {
              updateSubjects(result.subjects, result.lectures);
              hideLoading();

              // 신청이 열려 있지 않은 학년이거나 접수 시간 전이면 서버가 빈 목록을 돌려준다
              if (!result.subjects || result.subjects.length === 0) {
                selectionPopup("📢 알림", "현재 신청 가능한 강의가 없습니다.\n신청이 열려 있지 않은 학년이거나 접수 시간 전일 수 있습니다.\n문의: 학원으로 연락 부탁드립니다.");
                return;
              }

              if (typeof onDone === "function") onDone();
            })
            .withFailureHandler(() => {
              hideLoading();
              selectionPopup("⚠ 경고", "과목 정보를 불러오지 못했습니다. 학년을 다시 선택해 주세요.");
            })
            .getSubjectsAndLectures(grade);
        }

        function fetchLectures() {
          const grade = document.getElementById('grade').value;
          const subject = document.getElementById('subject').value;

          showLoading();

          google.script.run
            .withSuccessHandler((lectures) => {
              if (!lecturesCache[grade]) {
                lecturesCache[grade] = {};
              }
              lecturesCache[grade][subject] = lectures;
              updateLectures(lectures);
              hideLoading();
            })
            .withFailureHandler(() => {
              hideLoading();
              selectionPopup("⚠ 경고", "강의 정보를 불러오지 못했습니다. 과목을 다시 선택해 주세요.");
            })
            .getLectures(grade, subject);
        }

        function updateSubjects(subjects, lectures) {
          const subjectSelect = document.getElementById('subject');
          subjectSelect.innerHTML = '';
          subjects.forEach(subject => {
            const option = document.createElement('option');
            option.value = subject;
            option.textContent = subject;
            subjectSelect.appendChild(option);
          });
          updateLectures(lectures || []);
        }

        function updateLectures(lectures) {
          const lectureSelect = document.getElementById('lecture');
          lectureSelect.innerHTML = '';
          lectures.forEach(lecture => {
            const option = document.createElement('option');
            option.value = lecture.name;
            option.textContent = lecture.name;

            if (lecture.closed) {
              option.disabled = true;
            }

            lectureSelect.appendChild(option);
          });
        }

        function addCourse() {
          const subject = document.getElementById("subject").value;
          const lecture = document.getElementById('lecture').value;

          if (!subject || subject === "선택" || !lecture || lecture === "선택") {
            selectionPopup("📢 알림", "과목과 강의를 선택해주세요.");
            return;
          }
          
          if (!lecture) {
            selectionPopup("📢 알림", "강좌를 선택해주세요.");
            return;
          }

          if (lecture.includes("마감")) {
            selectionPopup("❗마감된 강좌❗", "이미 마감된 강좌이며, 대기신청으로 진행됩니다.");
          } else {
            if (lecture.includes("(입반TEST)")) {
              selectionPopup("📝 입반TEST", "해당 강좌는 입반TEST가 있습니다.\n수강신청 완료 또는 신청내역 확인/변경 화면에서 TEST 예약이 가능합니다.");
            }
          }
          
          if (selectedCourses.includes(lecture)) {
            selectionPopup("📢 알림", "이미 추가된 강좌입니다.");
            return;
          }
          selectedCourses.push(lecture);
          updateCart();
        }

        function updateCart() {
          const cart = document.getElementById("cart");
          cart.innerHTML = "";
          selectedCourses.forEach((course, index) => {
            const listItem = document.createElement("li");
            listItem.classList.add('course-cart-item');
            const courseName = document.createElement('span');
            courseName.textContent = course;
            const removeButton = document.createElement('button');
            removeButton.textContent = 'X';
            removeButton.onclick = () => removeCourse(index);
            listItem.appendChild(courseName);
            listItem.appendChild(removeButton);
            cart.appendChild(listItem);
          });
        }

        function clearCart() {
          selectedCourses = [];
          updateCart();
        }

        function removeCourse(index) {
          selectedCourses.splice(index, 1);
          updateCart();
        }

        function onSubmit(event) {
          if (event && typeof event.preventDefault === "function") event.preventDefault();

          const name = document.getElementById("name").value.trim();
          const grade = document.getElementById("grade").value.trim();
          const school = document.getElementById("school").value.trim();
          const studentContact = getFullPhone("studentContact");
          const parentContact = getFullPhone("parentContact");

          if (!name || !grade || !school || studentContact.length < 13 || parentContact.length < 13) {
            selectionPopup("📢 알림", "모든 정보를 입력해주세요.");
            return;
          }
          if (!Array.isArray(selectedCourses) || selectedCourses.length === 0) {
            selectionPopup("📢 알림", "신청할 강좌를 추가해주세요.\n기존에 신청한 강좌 모두 취소를 원하실 경우\n학원으로 연락 부탁 드립니다.");
            return;
          }

          showLoading();

          google.script.run
            .withSuccessHandler(onSuccess)
            .withFailureHandler(function(err){
              hideLoading();
              onError(err);
            })
            .submitForm(name, grade, school, studentContact, parentContact, selectedCourses, isResubmission.toString());
        }

        function selectionPopup(title, message) {
          const plzSelect = document.getElementById("selection");
          document.getElementById("selection-title").innerText = title;
          document.getElementById("plzSelect-popup").innerText = message;
          plzSelect.style.display = "flex";
        }

        function closeSelect() {
          const plzSelect = document.getElementById("selection");
          plzSelect.style.display = "none";
        }

        function onSuccess(responseObj) {
          try { console.log("submitForm response:", responseObj); } catch(e){}

          if (!responseObj || typeof responseObj !== "object") {
            hideLoading();
            selectionPopup("⚠ 경고", "서버 응답이 올바르지 않습니다. 다시 시도해주세요.");
            return;
          }

          const {
            message = "",
            currentCourses = [],
            duplicateCourses = [],
            waitingList = {}
          } = responseObj;

          const name = (document.getElementById("name")?.value || "").trim();
          const grade = (document.getElementById("grade")?.value || "").trim();
          const school = (document.getElementById("school")?.value || "").trim();
          const studentContact = typeof getFullPhone === "function" ? getFullPhone("studentContact") : "";
          const parentContact = typeof getFullPhone === "function" ? getFullPhone("parentContact") : "";

          const dupEl = document.getElementById("duplicateCourses");

          document.getElementById("submit-message").innerText = message;
          document.getElementById("checkName").innerText = name;
          document.getElementById("checkGrade").innerText = `${school} / ${grade}`;
          document.getElementById("checkStudentContact").innerText = studentContact;
          document.getElementById("checkParentContact").innerText = parentContact;

          if (Array.isArray(duplicateCourses) && duplicateCourses.length > 0) {
            if (dupEl) {
              dupEl.innerText = "⚠️ 중복된 강좌: " + duplicateCourses.join(", ");
              dupEl.style.display = "block";
            } else {
              console.warn("duplicateCourses present but #duplicateCourses element not found");
            }
          } else if (dupEl) {
            dupEl.style.display = "none";
            dupEl.innerText = "";
          }

          let waitingEl = document.getElementById("waitingList");
          if (!waitingEl) {
            const container = document.querySelector("#checkRegist .checkRegist-content");
            if (container) {
              waitingEl = document.createElement("div");
              waitingEl.id = "waitingList";
              waitingEl.style.display = "none";
              waitingEl.style.color = "#d9534f";
              waitingEl.style.fontWeight = "600";
              waitingEl.style.margin = "6px 0 12px 0";
              container.insertBefore(waitingEl, container.querySelector(".checkGrid"));
            }
          }

          if (waitingEl) {
            const waitKeys = Object.keys(waitingList || {});
            if (waitKeys.length > 0) {
              const parts = waitKeys.map(k => `(대기 ${waitingList[k]}번) ${k}`);
              waitingEl.innerText = "⏳ 대기신청: " + parts.join(", ");
              waitingEl.style.display = "block";
            } else {
              waitingEl.style.display = "none";
              waitingEl.innerText = "";
            }
          }

          const currentCoursesDiv = document.getElementById("currentCourses");
          currentCoursesDiv.innerHTML = "";

          const current = Array.isArray(currentCourses) ? currentCourses : [];
          current.forEach(function(course) {
            const div = document.createElement("div");
            div.textContent = `• ${course}`;
            currentCoursesDiv.appendChild(div);
          });

          document.getElementById("informForm").style.display = "none";
          document.getElementById("registrationForm").style.display = "none";

          const hasTestCourse = current.some(course => String(course).includes("TEST"));



          if (hasTestCourse) {
            document.getElementById("test-btn").style.display = "block";
          } else {
            document.getElementById("test-btn").style.display = "none";
          }

          document.getElementById("checkRegist").style.display = "block";

          hideLoading();

          selectedCourses = [];
          updateCart();
          lecturesCache = {};
          isResubmission = false;

        }

        function onError(error) {
          hideLoading();
          console.error("신청 중 오류 발생:", error);
          // 서버가 보낸 한글 안내(접수 시간 전, 닫힌 학년 등)는 그대로 보여주고, 그 외 오류는 일반 문구로 안내
          const message = (error && /[가-힣]/.test(String(error.message))) ? error.message : "오류가 발생했습니다. 다시 시도해 주세요.";
          selectionPopup("⚠ 경고", message);
        }



        function moveToNext(current, nextFieldId) {
          current.value = current.value.replace(/[^0-9]/g, ''); // 숫자 이외의 문자 제거

          if (current.value.length > current.maxLength) {
            current.value = current.value.slice(0, current.maxLength);
          }

          if (current.value.length === current.maxLength && nextFieldId) {
            document.getElementById(nextFieldId).focus();
          }
        }

        function showLoading() {
          document.getElementById("loading").style.display = "flex";
          if (loadingTimeout) clearTimeout(loadingTimeout);

          loadingTimeout = setTimeout(() => {
            hideLoading();
            selectionPopup("⚠ 경고", "응답이 지연되고 있습니다. 다시 시도해 주세요.");
          }, 30000); // 30초 (30000ms)
        }

        function hideLoading() {
          document.getElementById("loading").style.display = "none";
          if (loadingTimeout) {
            clearTimeout(loadingTimeout);
            loadingTimeout = null;
          }
        }

            <legend>📋 수강신청 방법 안내</legend>
            <div class="info-box">
              <ul>
                <li>다과목 신청의 경우, 과목/강의를 여러 번 추가하여 일괄 신청이 가능합니다.</li>
                <li>정확한 정보를 입력하셔야 수강신청 내역 조회가 가능합니다.</li>
                <li>수강 등록 안내는 추후 일괄 안내 예정입니다.</li>
                <li>수강신청에 어려움이 있으신 경우 전화로도 신청 가능합니다.</li>
              </ul>
              
              <p class="contact">📞 053-782-5050<br>
                <small>평일 오후 2시 ~ 오후 10시<br>주말 오전 9시 ~ 오후 10시</small>
              </p>
            </div>
          </fieldset>

          <div id="helpmePlz">
            <label for="helpme">📌 수강 과목 선택이 어려우실 경우, 상담 신청 접수 해주시면 연락 드려서 도움 드리겠습니다.</label>
            <div id="button-set">
              <button type="button" onclick="helpmePlease()" class="helpme-btn">상담 신청 바로가기</button>
              <button type="button" onclick="redirectToHome()"class="gohome">홈페이지 바로가기</button>
            </div>
            <button type="button" onclick="openlookupForm()" class="check-Submit">신청내역 확인/변경</button>
            <button type="button" onclick="registLecture()" class="regist-btn">수강신청 하러 가기</button>
          </div>
        </form>


        <form id="registrationForm" onsubmit="onSubmit(event); return false;" style="display: none;" novalidate>
          <div class="input-grid">
            <label for="name">학생명</label>
            <input type="text" id="name" name="name" required class="short-input" placeholder="김델타">
          
            <label for="school">학교</label>
            <input type="text" id="school" name="school" required class="short-input" placeholder="현재 학교명 입력 (예시: 델타중)">

            <label for="grade">학년</label>
            <div class="select-wrapper">
              <select id="grade" name="grade" required class="short-input" onchange="fetchSubjects()">
                <option value="">선택</option>
                <!-- <option value="초6">예비초6</option>
                <option value="중1">예비중1</option>
                <option value="중2">예비중2</option>
                <option value="중3">예비중3</option> -->
                <option value="고1">예비고1</option>
                <!-- <option value="고2">예비고2</option>
                <option value="고3">예비고3&N수</option>
                <option value="일과고">일과고</option> -->
              </select>
            </div>
          </div>

          <label id="helpNum" for="helpNum">※ 연락처를 제대로 입력하지 않으면 수강신청 확인이 불가하니, 정확하게 입력 부탁 드립니다.<br>※ 학생 연락처가 없을 경우, 학부모님 연락처와 동일하게 입력 부탁 드립니다.</label>

          <div class="inputphone-grid">
            <label for="studentContact">학  생 연락처</label>
            <div>
              <input type="text" inputmode="numeric" id="studentContact1" name="studentContact1" maxlength="3" required class="phone-input" placeholder="010"
                    oninput="handlePhoneInput(this,'studentContact2')">
              <span class="dash">-</span>
              <input type="text" inputmode="numeric" id="studentContact2" name="studentContact2" maxlength="4" required class="phone-input" placeholder="1234"
                    oninput="handlePhoneInput(this,'studentContact3')">
              <span class="dash">-</span>
              <input type="text" inputmode="numeric" id="studentContact3" name="studentContact3" maxlength="4" required class="phone-input" placeholder="5678"
                    oninput="handlePhoneInput(this,'parentContact1')">
            </div>

            <label for="parentContact">학부모 연락처</label>
            <div>
              <input type="text" inputmode="numeric" id="parentContact1" name="parentContact1" maxlength="3" required class="phone-input" placeholder="010"
                    oninput="handlePhoneInput(this,'parentContact2')">
              <span class="dash">-</span>
              <input type="text" inputmode="numeric" id="parentContact2" name="parentContact2" maxlength="4" required class="phone-input" placeholder="1234"
                    oninput="handlePhoneInput(this,'parentContact3')">
              <span class="dash">-</span>
              <input type="text" inputmode="numeric" id="parentContact3" name="parentContact3" maxlength="4" required class="phone-input" placeholder="5678"
                    oninput="handlePhoneInput(this)">
            </div>

            <label for="subject">과목</label>
            <div class="select-wrapper">
              <select id="subject" name="subject" required class="short-input" onchange="fetchLectures()">
                <option value="선택">선택</option>
              </select>
            </div>

            <label for="lecture">강의</label>
            <div class="select-wrapper">
              <select id="lecture" name="lecture" required class="wide-input">
                <option value="선택">선택</option>
              </select>
            </div>
          </div>

          
          <button type="button" onclick="addCourse()" class="addCourse-btn">강의추가</button>

          <fieldset class="course-cart">
              <legend>신청강의</legend>
              <ul id="cart"></ul>
              <button type="button" onclick="clearCart()" class="clear-cart-btn">신청강의 비우기</button>
          </fieldset>

          <input type="submit" value="신청하기" style="margin-top: 15px;">
        </form>


        <form id="lookupForm" class="lookupForm" style="display: none;">
          <div class="lookupForm-content">
            <button type="button" class="close-btn" onclick="closelookupForm()">뒤로 돌아가기 ✖</button>
            <h2>📋 수강신청 내역 조회</h2>

            <div class="lookup-grid">
              <label for="lookupName">학생명</label>
              <input type="text" id="lookupName" class="short-input" placeholder="김델타">

              <label for="lookupGrade">학년</label>
              <div class="select-wrapper">
                <select id="lookupGrade" class="short-input">
                  <!-- <option value="선택">선택</option>
                  <option value="초6">예비초6</option>
                  <option value="중1">예비중1</option>
                  <option value="중2">예비중2</option>
                  <option value="중3">예비중3</option> -->
                  <option value="고1">예비고1</option>
                  <!-- <option value="고2">예비고2</option>
                  <option value="고3">예비고3&N수</option>
                  <option value="일과고">일과고</option> -->
                </select>
              </div>

              <label for="lookupParentContact">학부모 연락처</label>
              <div class="phone-group">
                <input type="text" inputmode="numeric" id="lookupParentContact1" maxlength="3" required class="phone-input" placeholder="010"
                  oninput="handlePhoneInput(this,'lookupParentContact2')">
                <span class="dash">-</span>
                <input type="text" inputmode="numeric" id="lookupParentContact2" maxlength="4" required class="phone-input" placeholder="1234"
                  oninput="handlePhoneInput(this,'lookupParentContact3')">
                <span class="dash">-</span>
                <input type="text" inputmode="numeric" id="lookupParentContact3" maxlength="4" required class="phone-input" placeholder="5678"
                  oninput="handlePhoneInput(this)">
              </div>
            </div>

            <button type="button" onclick="fetchSubmissionData()" class="search-btn">신청내역 조회</button>

            <div id="lookupResults" style="margin-top: 20px;"></div>

            <div class="button-container2" style="margin-top: 25px; text-align: center;">
              <button id="change-btn" type="button" class="change-btn" style="display: none;" onclick="loadPreviousApplication()">신청내역<br>변경하기</button>
              <button type="button" id="test-btn2" class="test-btn2" style="display:none;" onclick="goToTest()">📝입반TEST<br>예약하기</button>
            </div>
          </div>
        </form>



        <form id="checkRegist" class="checkRegist" style="display:none;">
          <div class="checkRegist-content">
            <h2>📋수강신청 완료!</h2>
            <p id="submit-message"></p>

            <div id="duplicateCourses" style="display:none; color:#d9534f; font-weight:600; margin:6px 0 12px 0;"></div>

            <div class="checkGrid">
              <label>학생명</label><div class="value" id="checkName"></div>
              <label>학교/학년</label><div class="value" id="checkGrade"></div>
              <label>학생 연락처</label><div class="value" id="checkStudentContact"></div>
              <label>학부모 연락처</label><div class="value" id="checkParentContact"></div>
              <label>현재 신청내역</label>
                <div class="value" id="checkLecture">
                  <div id="currentCourses"></div>
                </div>
                
                <!-- 261025 신청내역 하나로 수정
                <div id="newCoursesTitle" class="course-title" style="display:none;">📘 신규 신청내역</div>
                <div id="newCourses"></div>

                <div id="previousCoursesTitle" class="course-title" style="display:none;">📚 기존 신청내역</div>
                <div id="previousCourses"></div>
                -->
            </div>
            
            <div class="button-container" style="margin-top: 25px; text-align: center;">
              <button type="button" class="primary-btn" onclick="goToHome()">🏠첫화면<br>돌아가기</button>
              <button type="button" class="secondary-btn" style="margin-left: 10px;" onclick="goToChange()">✏️신청내역<br>변경하기</button>
              <button type="button" id="test-btn" class="test-btn" style="margin-left: 10px; display:none;" onclick="goToTest()">📝입반TEST<br>예약</button>
            </div>
          </div>
        </form>

      </div>


      <div id="selection" style="display: none;">
        <h2 id="selection-title"></h2>
        <p id="plzSelect-popup"></p><br>
        <button onclick="closeSelect()">닫기</button>
      </div>

      <div id="loading" style="display: none;">
        <div class="loading-spinner"></div>
        <p class="loading-text">불러오는 중...</p>
      </div>
    
    </body>
</html>
